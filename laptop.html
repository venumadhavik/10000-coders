<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <title>keyboard</title>
    <style>

         * {
        box-sizing: border-box; 
        font-size: 17px;
        /* Apply border-box model to all elements */
    }
        .div{
            border: 5px solid black;
            width: 800px;
            height: 600px;
            margin: 30px;

           

           

        }
        button{
            box-shadow: 6px 6px rgb(160, 175, 176);
        }
        .row11{
            display: flex;
            flex-direction: row;
            column-gap: 15px;
            height: 30px;
            margin: 10px ;

        }
        .row22{
            display: flex;
            column-gap: 10px;
            height: 50px;
            margin: 10px;
        }
        .row33,.row44,.row55{
            display: flex;
            column-gap: 8px;
            height: 50px;
            margin: 10px;
        }
        .row1{
            border: 2px solid black;
            flex-basis: 50px;



        }
        .row2,.row3,.row4,.row5{
            flex-basis: 50px;
        }
       
         .row{
            flex-basis: 100px;
        }
        .row66{
            display: flex;
            column-gap: 10px;
            height: 50px;
            margin: 10px;

        }
        .row6{
            flex-basis: 60px;
        }
        .row0{
            flex-basis: 250px;

        }
        .c1{
            border: 2px solid black;
            height: 200px;
            width: 300px;
            margin-left: 240px;
            
        }
        .c2{
            height: 20px;
            width: 80px;
            margin: 10px;
            border-radius: 10px;
        }
        .c2 i{
            margin-left: 74px;
        }
        .row00{
            margin-right: -60px;
            height: 25px;
            
        }
        .row01{
            
            height: 25px;
            margin-top: 25px;
            margin-right: 10px;
        }
            
        

        

    </style>
</head>
<body>
   

</div>
    <div class="div">
        <div class="c11">
            <button class="c2"><i class="fa-solid fa-power-off"></i></button>
        </div>
        <div class="row11">
            <button class="row1">esc</button>
            <button class="row1">f1</button>
            <button class="row1">f2</button>
            <button class="row1">f3</button>
            <button class="row1">f4</button>
            <button class="row1">f5</button>
            <button class="row1">f6</button>
            <button class="row1">f7</button>
            <button class="row1">f8</button>
            <button class="row1">f9</button>
            <button class="row1">f10</button>
            <button class="row1">f11</button>
            <button class="row1">f12</button>
            <button class="row1">prtsc</button>
            <button class="row1"><i class="fa fa-power-off"></i></button>
        </div>
        <div class="row22">
            <button class="row2">`</button>
            <button class="row2">1</button>
            <button class="row2">2</button>
            <button class="row2">3</button>
            <button class="row2">4</button>
            <button class="row2">5</button>
            <button class="row2">6</button>
            <button class="row2">7</button>
            <button class="row2">8</button>
            <button class="row2">9</button>
            <button class="row2">0</button>
            <button class="row2">-</button>
            <button class="row2">=</button>
            <button class="row2">backspace</button>
        </div>
        <div class="row33">
            <button class="row3 row">tab</button>
            <button class="row3">Q</button>
            <button class="row3">W</button>
            <button class="row3">E</button>
            <button class="row3">R</button>
            <button class="row3">T</button>
            <button class="row3">Y</button>
            <button class="row3">U</button>
            <button class="row3">I</button>
            <button class="row3">O</button>
            <button class="row3">P</button>
            <button class="row3">[</button>
            <button class="row3">]</button>
            <button class="row3 row">\</button>
            

        </div>
        <div class="row44">
            <button class="row4 row">lock</button>

            <button class="row4">A</button>
            <button class="row4">S</button>
            <button class="row4">D</button>
            <button class="row4">F</button>
            <button class="row4">G</button>
            <button class="row4">H</button>
            <button class="row4">J</button>
            <button class="row4">K</button>
            <button class="row4">L</button>
            <button class="row4">;</button>
            <button class="row4">'</button>
            <button class="row4 row">enter</button>
        </div>
        <div class="row55">
            <button class="row5 row">shift</button>
            <button class="row5">Z</button>
            <button class="row5">X</button>
            <button class="row5">C</button>
            <button class="row5">V</button>
            <button class="row5">B</button>
            <button class="row5">N</button>
            <button class="row5">M</button>
            <button class="row5">,</button>
            <button class="row5">.</button>
            <button class="row5">/</button>
            <button class="row5 row">shift</button>
        </div>
        <div class="row66">
            <button class="row6">ctrl</button>
            <button class="row6">fn</button>
            <button class="row6"><i class="fa-brands fa-windows"></i></button>
            <button class="row6">alt</button>
            <button class="row6 row0">space</button>
            <button class="row6">alt</button>
            <button class="row6">ctrl</button>
            <button class="row6"><i class="fa-solid fa-caret-left"></i></button>
            <button class="row6 row00"><i class="fa-solid fa-caret-up"></i></button>
            <button class="row6 row01"><i class="fa-solid fa-sort-down"></i></button>

            <button class="row6"><i class="fa-solid fa-caret-right"></i></button>

        </div>
        <div class="c">
            <button class="c1"></button>
        </div>

    </div>
    
</body>
</html>

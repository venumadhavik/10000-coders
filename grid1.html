<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            gap: 10px;
            background-color: black;
            grid-template-areas:
            " header header header"
              "aside1 article1 article2"
              /* "aside2 article1 article2" */
              "footer footer footer";
        }
        .header{
            grid-area:header;
        }
        .aside1{
            grid-area:aside1;

        }
        /* .aside2{
            grid-area:aside2;

        } */
        .article1{
            grid-area:article1;

        }
        .article2{
            grid-area:article2;

        }
        .footer{
            grid-area: footer;
        }
        .container div{
            background-color: orangered;

        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header"> header</div>

        <div class="aside1"> aside1</div>
        <!-- <div class="aside2">aside2 </div> -->
        <div class="article1">article1 </div>
        <div class="article2">article2 </div>


        <div class="footer">footer</div>

    </div>
</body>
</html>
